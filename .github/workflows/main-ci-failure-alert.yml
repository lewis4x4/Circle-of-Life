name: Main CI failure alert

on:
  workflow_run:
    workflows: ["CI — segment gates", "Netlify production failure alert", "Auto-merge when green"]
    types: [completed]
  schedule:
    - cron: '4-59/5 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  dispatch-primary:
    # PR completion catches automatic merges; the existing five-minute monitor
    # repairs the race where the completion event arrives just before the merge.
    if: github.repository == 'lewis4x4/Circle-of-Life' && (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    concurrency:
      group: main-ci-dispatch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start missing primary CI on main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/dispatch-main-ci.mjs

  main-ci:
    if: github.repository == 'lewis4x4/Circle-of-Life' && github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.name == 'CI — segment gates'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: main-ci-alert
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve main CI incident routing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/netlify-production-failure-alert.mjs watch main-ci

  observer-health:
    if: github.repository == 'lewis4x4/Circle-of-Life' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: netlify-observer-health
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile observer coverage and audit old reruns
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/netlify-production-failure-alert.mjs watch observer
