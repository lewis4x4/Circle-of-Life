name: Enable Supabase PITR

# One-shot ops job: apply the PITR add-on on the Haven project using the
# repo Management API token. Does not print secrets. Idempotent if PITR is
# already on. Compute smaller than Small is upgraded first (PITR requirement).

on:
  workflow_dispatch:
    inputs:
      pitr_variant:
        description: PITR retention add-on variant
        type: choice
        options:
          - pitr_7
          - pitr_14
          - pitr_28
        default: pitr_7

permissions:
  contents: read

jobs:
  enable-pitr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Public Haven project ref (also in AGENTS.md). Do not take
      # vars.SUPABASE_PROJECT_REF — a mismatched secret would 403 billing.
      SUPABASE_PROJECT_REF: manfqmasfqppukpobpld
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PITR_VARIANT: ${{ inputs.pitr_variant || 'pitr_7' }}
    steps:
      - name: Apply PITR add-on
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          token = os.environ.get("SUPABASE_ACCESS_TOKEN", "").strip()
          ref = os.environ.get("SUPABASE_PROJECT_REF", "").strip()
          variant = os.environ.get("PITR_VARIANT", "pitr_7").strip() or "pitr_7"
          if not token:
              print("SUPABASE_ACCESS_TOKEN is missing", file=sys.stderr)
              sys.exit(1)
          if not ref:
              print("SUPABASE_PROJECT_REF is missing", file=sys.stderr)
              sys.exit(1)

          print(f"Project ref: {ref}")
          print(f"Requested PITR variant: {variant}")

          def api(method, path, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  f"https://api.supabase.com/v1/{path}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                      # Cloudflare 1010 blocks default Python-urllib UA.
                      "User-Agent": "supabase-cli/2.101.0",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      raw = resp.read().decode()
                      code = resp.status
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode()
                  code = exc.code
              try:
                  parsed = json.loads(raw) if raw else {}
              except json.JSONDecodeError:
                  parsed = {"raw": raw[:400]}
              if code >= 400:
                  msg = parsed.get("message") if isinstance(parsed, dict) else None
                  raw_prefix = parsed.get("raw") if isinstance(parsed, dict) else None
                  print(f"{method} {path} -> {code} keys={list(parsed)[:8] if isinstance(parsed, dict) else type(parsed).__name__}")
                  if msg:
                      print("  message:", str(msg)[:240])
                  if raw_prefix:
                      print("  raw:", str(raw_prefix)[:240])
              return code, parsed

          def selected_addons(payload):
              selected = payload.get("selected_addons") or payload.get("addons") or []
              if isinstance(selected, dict):
                  selected = selected.get("selected_addons") or []
              return selected if isinstance(selected, list) else []

          def variant_id(value):
              if isinstance(value, dict):
                  return str(value.get("id") or value.get("name") or "").strip()
              return str(value or "").strip()

          def inspect_addons(payload):
              compute = None
              pitr_present = False
              for item in selected_addons(payload):
                  if not isinstance(item, dict):
                      continue
                  kind = str(item.get("type") or item.get("addon_type") or "")
                  item_variant = variant_id(item.get("variant") or item.get("addon_variant"))
                  print("-", kind or "(unknown)", item_variant or "(none)")
                  if kind == "pitr" or item_variant.startswith("pitr_"):
                      pitr_present = True
                  if "compute" in kind or item_variant.startswith("ci_"):
                      compute = item_variant or kind
              return compute, pitr_present

          def apply_addon(body, label, attempts=6, wait_s=130):
              last = (None, {})
              for attempt in range(1, attempts + 1):
                  code, payload = api("PATCH", f"projects/{ref}/billing/addons", body)
                  last = (code, payload)
                  msg = payload.get("message") if isinstance(payload, dict) else ""
                  print(f"{label} PATCH attempt {attempt} -> {code}")
                  if msg:
                      print(f"  {label} message:", str(msg)[:240])
                  if code < 400:
                      return last
                  retryable = code in {429, 400} and any(
                      token in str(msg).lower()
                      for token in ("try again", "not in a healthy state", "still processing")
                  )
                  if not retryable or attempt == attempts:
                      return last
                  print(f"Waiting {wait_s}s before retry...")
                  time.sleep(wait_s)
              return last

          code, addons = api("GET", f"projects/{ref}/billing/addons")
          print(f"GET addons -> {code}")
          if isinstance(addons, dict) and addons.get("message"):
              print("addons message:", str(addons.get("message"))[:240])

          compute, pitr_present = inspect_addons(addons)
          large_enough = {
              "ci_small",
              "ci_medium",
              "ci_large",
              "ci_xlarge",
              "ci_2xlarge",
              "ci_4xlarge",
              "ci_8xlarge",
              "ci_12xlarge",
              "ci_16xlarge",
          }
          print("Current compute variant:", compute or "none")

          if not pitr_present:
              if compute not in large_enough:
                  print("Upgrading compute to ci_small so PITR can be enabled...")
                  apply_addon(
                      {"addon_type": "compute_instance", "addon_variant": "ci_small"},
                      "compute",
                  )
              print(f"Enabling PITR {variant}...")
              apply_addon({"addon_type": "pitr", "addon_variant": variant}, "pitr")
          else:
              print("PITR add-on already present.")

          bcode, backups = api("GET", f"projects/{ref}/database/backups")
          print(f"GET backups -> {bcode}")
          print("pitr_enabled:", backups.get("pitr_enabled") if isinstance(backups, dict) else None)
          print("walg_enabled:", backups.get("walg_enabled") if isinstance(backups, dict) else None)
          if isinstance(backups, dict) and backups.get("message"):
              print("backups message:", str(backups.get("message"))[:240])
          if not isinstance(backups, dict) or backups.get("pitr_enabled") is not True:
              print("PITR is still off after apply", file=sys.stderr)
              sys.exit(1)
          print("PITR enable confirmed.")
          PY
