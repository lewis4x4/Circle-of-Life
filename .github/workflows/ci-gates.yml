name: CI — segment gates

on:
  push:
    branches: [main, master]
  pull_request:
  # GitHub merge queue: the queue tests each PR on top of the ones ahead of it.
  merge_group:

concurrency:
  group: haven-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify change risk
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      classification_safe: ${{ steps.risk.outputs.classification_safe }}
      database_sensitive: ${{ steps.risk.outputs.database_sensitive }}
      finance_sensitive: ${{ steps.risk.outputs.finance_sensitive }}
      ui_sensitive: ${{ steps.risk.outputs.ui_sensitive }}
      release_sensitive: ${{ steps.risk.outputs.release_sensitive }}
      policy_only: ${{ steps.risk.outputs.policy_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: risk
        run: node scripts/ci/classify-changes.mjs
        env:
          CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CI_DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          CI_DIFF_MODE: ${{ github.event_name == 'pull_request' && 'merge-base' || 'range' }}

  gates:
    name: Application and platform gates
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Gate failure regression tests
        run: node --test scripts/ci/classify-changes.test.mjs scripts/ci/release-tree-proof.test.mjs scripts/ci/netlify-production-failure-alert.test.mjs scripts/review-gates.test.mjs

      - name: TypeScript and application tests
        if: needs.classify.outputs.policy_only != 'true'
        run: npm run typecheck && npm test

      - uses: denoland/setup-deno@v2
        if: needs.classify.outputs.policy_only != 'true'
        with:
          deno-version: v2.x

      - name: Smart Rounding policy source checks
        if: needs.classify.outputs.policy_only != 'true'
        run: |
          node --test scripts/smart-rounding/sql-policy-literals.test.mjs
          npm run smart-rounding:literals
          node scripts/smart-rounding/sql-policy-literals.mjs

      - name: Smart Rounding Edge Function tests
        if: needs.classify.outputs.policy_only != 'true'
        run: npm run test:edge

      - name: Signing authorization and delivery idempotency regression tests
        if: needs.classify.outputs.policy_only != 'true'
        # Synthetic transport only: no live provider or database credentials.
        run: deno test --allow-env --no-lock supabase/functions/boldsign-send-contract-handler.test.ts supabase/functions/boldsign-webhook-handler.test.ts supabase/functions/_shared/current-actor.test.ts

      - name: Officer catalog Edge Function tests
        if: needs.classify.outputs.policy_only != 'true'
        # Not gated behind HAVEN_UI_GATES_ENABLED: the verifier must be proven
        # on every push and pull request (signing bytes, cross-target refusal,
        # tampered body, malformed headers, refusal-recording gate).
        run: |
          cd supabase/functions
          deno check officer-catalog/index.ts officer-catalog-handler.test.ts officer-catalog/signature.test.ts care-event-dispatcher/index.ts
          deno test --allow-env --allow-net=example.invalid officer-catalog-handler.test.ts officer-catalog/signature.test.ts care-event-dispatcher/

      - name: Compliance document triage routing
        if: needs.classify.outputs.policy_only != 'true'
        # Not gated behind HAVEN_UI_GATES_ENABLED. These cover what Haven tells
        # an insurance agent: that a confirmed missing HUD 232 party blocks, that
        # an uncertain reading goes to a person instead, and that generic
        # mortgagee wording is caught on evidence of property insurance and not
        # only on documents calling themselves endorsements.
        # Fixed answers, no network, no keys.
        run: |
          cd supabase/functions
          deno check compliance-doc-check/index.ts compliance-doc-check/handler.ts _shared/compliance-doc-questions.ts
          deno test --allow-env compliance-doc-check-handler.test.ts

      - name: Care event voice prefill
        if: needs.classify.outputs.policy_only != 'true'
        # Not gated behind HAVEN_UI_GATES_ENABLED, for the same reason as the
        # step above: these cover what Haven puts on a caregiver's screen over a
        # resident on the floor. That silence is never read as "nobody saw the
        # fall", that a chip is highlighted on the winning option's own
        # probability and not on `confidence`, and that an option the Fall tile
        # does not offer is refused rather than passed through.
        # Fixed answers, no network, no keys.
        run: |
          cd supabase/functions
          deno check care-event-prefill/index.ts care-event-prefill/prefill.ts _shared/care-event-prefill-questions.ts
          deno test --allow-env care-event-prefill-handler.test.ts

      - name: Stand Up regression contracts
        if: needs.classify.outputs.policy_only != 'true'
        run: |
          python3 -B -m unittest discover -s scripts/stand-up -p 'test_*.py'
          npx vitest run src/lib/stand-up src/components/stand-up src/app/api/stand-up

      - name: Migrations can apply to a hosted project
        if: needs.classify.outputs.policy_only != 'true'
        # Not gated behind HAVEN_UI_GATES_ENABLED. Migration 380 called
        # public.gen_random_uuid() in 22 places and could never have applied
        # hosted, yet it passed review and passed the local replay (COL-370).
        # Static, no credentials, sub-second.
        run: npm run migrations:check:hosted

      - name: Migration number is not already claimed
        # In the merge queue the PR's own claim is the one being merged; the
        # sideways check already ran on the pull request itself.
        if: needs.classify.outputs.policy_only != 'true' && github.event_name != 'merge_group'
        # `migrations:check` only sees one working tree, so it catches a
        # duplicate number after both branches have merged — which is how main
        # spent twenty minutes failing its own sequence check on 2026-09-16,
        # when COL-353 (#579) and COL-465 (#583) both took 412 eight minutes
        # apart. This one looks sideways at open pull requests instead, so the
        # collision surfaces on the branch that can still cheaply renumber.
        # Read-only; needs the token to list open PRs.
        run: npm run migrations:check:claims
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install verified Gitleaks binary
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/haven-gitleaks-8.30.1"
          mkdir -p "$scanner_dir"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" version
          echo "$scanner_dir" >> "$GITHUB_PATH"

      - name: Policy hygiene and secret scan
        if: needs.classify.outputs.policy_only == 'true'
        run: |
          npm run check:package-manager
          npm run check:env-example
          npm run check:secrets
          npm run audit:ci
          npm run secrets:gitleaks

      - name: Seed roster auth verify
        # Authenticates every account in `scripts/seed/canonical-roster.mjs`
        # against the pilot Supabase project. Pre-launch this gate is
        # **dormant** — gated by `vars.HAVEN_UI_GATES_ENABLED == 'true'`.
        # Flip the repo variable to enable. Once enabled, ANY roster auth
        # failure fails the build before expensive work runs.
        # See docs/ui-audit/SEED_DRIFT.md for the ledger + repair plan.
        if: needs.classify.outputs.policy_only != 'true' && vars.HAVEN_UI_GATES_ENABLED == 'true'
        run: npm run seed:verify
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL_TEST }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_TEST }}
          PHASE1_DEMO_PASSWORD: ${{ secrets.PHASE1_DEMO_PASSWORD }}

      - name: CI account auth verify
        # Authenticates the named CI accounts in HOMEWOOD_LAUNCH_ACCOUNTS and
        # checks each resolves to the role it claims. It no longer enumerates
        # Homewood's grants: those are real staff with their own passwords, so
        # that check could only pass by holding their credentials or by putting
        # test identities on the live launch facility (COL-443). Same dormant
        # pattern as the seed verify above — gated on `vars.HAVEN_UI_GATES_ENABLED`.
        if: needs.classify.outputs.policy_only != 'true' && vars.HAVEN_UI_GATES_ENABLED == 'true'
        run: npm run homewood:verify-auth
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL_TEST }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_TEST }}
          # COL-443: no service-role key. The gate verifies the named CI
          # accounts below, each of which proves its own role by signing in,
          # so nothing here needs to enumerate users or bypass RLS.
          HOMEWOOD_LAUNCH_ACCOUNTS: ${{ secrets.HOMEWOOD_LAUNCH_ACCOUNTS }}
          HOMEWOOD_LAUNCH_PASSWORD: ${{ secrets.HOMEWOOD_LAUNCH_PASSWORD }}

      - name: Segment gates (security, lint, migrations, build, stress)
        if: needs.classify.outputs.policy_only != 'true'
        # Core checks must run even when credentialed browser tests are dormant.
        run: npm run segment:gates -- --segment "ci-${{ github.run_id }}"
        env:
          CI: true
          # The segment runner remains the only full-replay owner. Application-only
          # changes skip it explicitly; database-sensitive and uncertain diffs fail
          # closed and require Docker-backed verification.
          REQUIRE_PG_VERIFY: ${{ needs.classify.outputs.database_sensitive != 'false' && '1' || '0' }}
          SKIP_PG_VERIFY: ${{ needs.classify.outputs.database_sensitive == 'false' && '1' || '0' }}

      - name: Install Playwright Chromium
        if: needs.classify.outputs.policy_only != 'true'
        run: npx playwright install --with-deps chromium

      - name: Smart Rounding component browser regressions
        if: needs.classify.outputs.policy_only != 'true'
        # Synthetic component requests need no hosted identity or credentials.
        run: npx playwright test --config=playwright.smart-rounding-fixture.config.ts

      - name: Upload gate and synthetic browser evidence
        if: always() && needs.classify.outputs.policy_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smart-rounding-regressions
          path: |
            test-results/agent-gates/*-ci-${{ github.run_id }}.json
            test-results/smart-rounding-fixture/

      - name: Route probe + auth smoke
        if: needs.classify.outputs.policy_only != 'true' && vars.HAVEN_UI_GATES_ENABLED == 'true'
        run: |
          npm run start -- --hostname 127.0.0.1 --port 4310 > /tmp/haven-next-start.log 2>&1 &
          server_pid=$!
          trap 'kill ${server_pid}' EXIT

          ready=0
          for i in {1..60}; do
            if curl -sSf -o /dev/null http://127.0.0.1:4310/login; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "${ready}" -ne 1 ]; then
            cat /tmp/haven-next-start.log
            exit 1
          fi

          BASE_URL=http://127.0.0.1:4310 npm run demo:web-health
          BASE_URL=http://127.0.0.1:4310 npm run demo:auth-smoke
        env:
          CI: true

      - name: Detect UI changes
        id: ui_changes
        run: echo "ui_changed=${{ needs.classify.outputs.ui_sensitive == 'false' && 'false' || 'true' }}" >> "$GITHUB_OUTPUT"

      - name: UI gates (conditional)
        if: needs.classify.outputs.policy_only != 'true' && steps.ui_changes.outputs.ui_changed == 'true' && vars.HAVEN_UI_GATES_ENABLED == 'true'
        run: npm run segment:gates -- --segment "ci-ui-${{ github.run_id }}" --ui --no-chaos --design-advisory
        env:
          CI: true
          REQUIRE_PG_VERIFY: "0"
          SKIP_PG_VERIFY: "1"

      - name: Bundle size snapshot
        # Depends on `.next/static/` produced by the core Segment-gates build.
        # The dedicated bundle-size workflow also checks every PR.
        if: needs.classify.outputs.policy_only != 'true' && vars.HAVEN_UI_GATES_ENABLED == 'true'
        run: node scripts/bundle-size-check.mjs
        env:
          CI: true

      - name: Record tested merge tree
        if: github.event_name == 'pull_request'
        run: node scripts/ci/release-tree-proof.mjs record
        env:
          CLASSIFICATION_SAFE: ${{ needs.classify.outputs.classification_safe }}
          DATABASE_SENSITIVE: ${{ needs.classify.outputs.database_sensitive }}
          FINANCE_SENSITIVE: ${{ needs.classify.outputs.finance_sensitive }}
          UI_SENSITIVE: ${{ needs.classify.outputs.ui_sensitive }}
          RELEASE_SENSITIVE: ${{ needs.classify.outputs.release_sensitive }}
          POLICY_ONLY: ${{ needs.classify.outputs.policy_only }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Upload tested merge tree proof
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-tree-proof
          path: test-results/ci-release-proof/release-tree-proof.json
          if-no-files-found: error
          retention-days: 30

  finance:
    name: Finance-specific tests
    if: needs.classify.result == 'success' && needs.classify.outputs.finance_sensitive != 'false'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Finance and platform audit contracts
        run: |
          npm run test:finance-integration
          npm run test:platform-audit
          npm run test:audit-edge
          npm run test:finance-webhook
          npm run test:finance-read
          npm run test:finance-provider-contract

      - name: Upload finance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-audit-evidence
          path: test-results/finance-integration/
          if-no-files-found: error

  required:
    name: Required CI summary
    if: always()
    needs: [classify, gates, finance]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce applicable jobs
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          GATES_RESULT: ${{ needs.gates.result }}
          FINANCE_RESULT: ${{ needs.finance.result }}
          CLASSIFICATION_SAFE: ${{ needs.classify.outputs.classification_safe }}
          DATABASE_SENSITIVE: ${{ needs.classify.outputs.database_sensitive }}
          FINANCE_SENSITIVE: ${{ needs.classify.outputs.finance_sensitive }}
          UI_SENSITIVE: ${{ needs.classify.outputs.ui_sensitive }}
          RELEASE_SENSITIVE: ${{ needs.classify.outputs.release_sensitive }}
          POLICY_ONLY: ${{ needs.classify.outputs.policy_only }}
        run: |
          test "$CLASSIFY_RESULT" = "success"
          test "$GATES_RESULT" = "success"
          test "$FINANCE_RESULT" = "success" || test "$FINANCE_RESULT" = "skipped"
          for value in "$CLASSIFICATION_SAFE" "$DATABASE_SENSITIVE" "$FINANCE_SENSITIVE" "$UI_SENSITIVE" "$RELEASE_SENSITIVE" "$POLICY_ONLY"; do
            test "$value" = "true" || test "$value" = "false"
          done
