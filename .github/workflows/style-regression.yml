name: style-regression

# Blocks anti-pattern strings from re-entering the codebase. Each step is
# a single grep that fails the job if it finds anything. Scoped to `src/`
# because this repo has no top-level `app/` or `components/` directories.

on:
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/style-regression.yml"

jobs:
  forbidden-patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "SYS: eyebrow pills"
        run: |
          ! grep -rnE "SYS:\s*(MODULE|[A-Z])" \
            src/ \
            --include="*.tsx" \
            --exclude-dir=node_modules \
            || (echo "::error::SYS: eyebrow pills found"; exit 1)

      - name: "Oversized dashboard numerics (text-5xl+ on PageClient)"
        run: |
          ! grep -rnE 'className="[^"]*\btext-(5xl|6xl|7xl|8xl|9xl)\b' \
            src/ \
            --include="*PageClient.tsx" \
            --exclude-dir=node_modules \
            || (echo "::error::text-5xl+ found on PageClient"; exit 1)

      - name: "Hero-card radii (rounded-3xl/[2.5rem] on PageClient)"
        run: |
          ! grep -rnE 'rounded-\[2\.5rem\]|rounded-3xl' \
            src/ \
            --include="*PageClient.tsx" \
            --exclude-dir=node_modules \
            || (echo "::error::rounded-3xl on PageClient"; exit 1)

      - name: "Uppercase CTAs"
        run: |
          ! grep -rnE 'uppercase tracking-(wider|widest)[^"]*\b(button|cta|primary)' \
            src/ \
            --include="*.tsx" \
            --exclude-dir=node_modules \
            || (echo "::error::uppercase CTA found"; exit 1)

      - name: "Gradient text on chrome (bg-clip-text + gradient on PageClient)"
        run: |
          ! grep -rnE 'bg-clip-text.*text-transparent.*bg-gradient' \
            src/ \
            --include="*PageClient.tsx" \
            --exclude-dir=node_modules \
            || (echo "::error::gradient text on PageClient"; exit 1)

      - name: "Hand-rolled wizard step indicators (use WizardSteps primitive)"
        # Catches dynamic ad-hoc step indicators outside the canonical
        # primitive at `src/components/ui/wizard-steps.tsx`. Scoped to
        # interpolated/variable forms (`Step ${n} of`, `step-${current}`,
        # `currentStep` paired with `totalSteps`) — literal 2-step modal
        # status text inside a ternary is intentionally NOT caught; the
        # rule targets indicator chrome, not status strings.
        # See docs/ui-audit/DESIGN_PRINCIPLES.md §11.
        run: |
          ! grep -rnE 'Step\s+\$\{[^}]+\}\s+of\b|step-\$\{(current|active|step|stepIndex)\b|currentStep[^,)]*of[^,)]*totalSteps' \
            src/ \
            --include="*.tsx" \
            --exclude="src/components/ui/wizard-steps.tsx" \
            --exclude-dir=node_modules \
            || (echo "::error::hand-rolled step indicator found — use <WizardSteps>/<WizardStep> from @/components/ui/wizard-steps"; exit 1)

      - name: "Hand-rolled bottom-nav (use BottomNav primitive)"
        # Catches fixed-position bottom tab bars built as inline `<nav>`
        # elements outside the canonical primitive at
        # `src/components/ui/bottom-nav.tsx`. Scoped to the `<nav>` tag
        # specifically — fixed-bottom action bars (e.g. operations CTA
        # strip) and bottom-drawer chrome (e.g. QuickCheckDrawer) are NOT
        # nav-bar patterns and intentionally NOT caught here. Re-tune if
        # a legitimate `<nav class="fixed bottom-0 …">` pattern emerges
        # outside the caregiver portal.
        # See docs/ui-audit/DESIGN_PRINCIPLES.md §12 / §13.
        run: |
          ! grep -rnE '<nav\b[^>]*className="[^"]*\b(fixed|inset-x-0)\b[^"]*\bbottom-0\b' \
            src/ \
            --include="*.tsx" \
            --exclude="src/components/ui/bottom-nav.tsx" \
            --exclude-dir=node_modules \
            || (echo "::error::hand-rolled bottom-nav <nav> found — use <BottomNav>/<BottomNavItem> from @/components/ui/bottom-nav"; exit 1)

      - name: "Hover-only states on audited caregiver chrome (pair with active:)"
        # On the caregiver shell + caregiver-scoped primitives, every
        # hover:X utility must ship with a matching active:X so touch
        # devices that never fire hover still render pressed-state
        # feedback. Heuristic: flag any className that contains `hover:`
        # without a corresponding `active:` token in the same string.
        # Scoped narrowly to the files Phase C has audited — caregiver
        # route-page workflows (`src/app/(caregiver)/**`) are NOT scanned
        # here; their hover/active pairing is the responsibility of a
        # future Phase D workflow-page audit. Expand the scope incrementally
        # as those files migrate.
        # See docs/ui-audit/DESIGN_PRINCIPLES.md §13.
        run: |
          set +e
          MATCHES=$(grep -rEn 'className=("|`|cn\()[^"`]*\bhover:[a-z-]' \
            src/components/layout/CaregiverShell.tsx \
            src/components/ui/bottom-nav.tsx \
            src/components/ui/status-pill.tsx \
            --include="*.tsx" \
            --exclude-dir=node_modules 2>/dev/null \
            | grep -v 'active:' \
            | grep -v 'group-hover:')
          set -e
          if [ -n "$MATCHES" ]; then
            echo "::error::caregiver chrome hover:* without a matching active:* — pair them so touch devices render pressed feedback"
            echo "$MATCHES"
            exit 1
          fi
