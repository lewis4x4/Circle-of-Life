name: style-regression

# Blocks anti-pattern strings from re-entering the codebase. Each step is
# a single grep that fails the job if it finds anything. Scoped to `src/`
# because this repo has no top-level `app/` or `components/` directories.

on:
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/style-regression.yml"

jobs:
  forbidden-patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "SYS: eyebrow pills"
        run: |
          ! grep -rnE "SYS:\s*(MODULE|[A-Z])" \
            src/ \
            --include="*.tsx" \
            --exclude-dir=node_modules \
            || (echo "::error::SYS: eyebrow pills found"; exit 1)

      - name: "Oversized dashboard numerics (text-5xl+ on PageClient)"
        run: |
          ! grep -rnE 'className="[^"]*\btext-(5xl|6xl|7xl|8xl|9xl)\b' \
            src/ \
            --include="*PageClient.tsx" \
            --exclude-dir=node_modules \
            || (echo "::error::text-5xl+ found on PageClient"; exit 1)

      - name: "Hero-card radii (rounded-3xl/[2.5rem] on PageClient)"
        run: |
          ! grep -rnE 'rounded-\[2\.5rem\]|rounded-3xl' \
            src/ \
            --include="*PageClient.tsx" \
            --exclude-dir=node_modules \
            || (echo "::error::rounded-3xl on PageClient"; exit 1)

      - name: "Uppercase CTAs"
        # Only scan added .tsx lines so pre-existing violations do not block
        # unrelated fixes or safe refactors of a file that still has debt.
        run: |
          set -euo pipefail
          MATCHES=$(
            git diff --unified=0 --no-color \
              "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
              -- ':(glob)src/**/*.tsx' \
              | grep -E '^\+[^+].*uppercase tracking-(wider|widest)[^"]*\b(button|cta|primary)' \
              || true
          )
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "::error::uppercase CTA found in PR-added lines"
            exit 1
          fi
          echo "No uppercase CTA pattern added"

      - name: "Gradient text on chrome (bg-clip-text + gradient on PageClient)"
        run: |
          ! grep -rnE 'bg-clip-text.*text-transparent.*bg-gradient' \
            src/ \
            --include="*PageClient.tsx" \
            --exclude-dir=node_modules \
            || (echo "::error::gradient text on PageClient"; exit 1)

      - name: "Hand-rolled wizard step indicators (use WizardSteps primitive)"
        # Catches dynamic ad-hoc step indicators outside the canonical
        # primitive at `src/components/ui/wizard-steps.tsx`. Scoped to
        # interpolated/variable forms (`Step ${n} of`, `step-${current}`,
        # `currentStep` paired with `totalSteps`) — literal 2-step modal
        # status text inside a ternary is intentionally NOT caught; the
        # rule targets indicator chrome, not status strings.
        # See docs/ui-audit/DESIGN_PRINCIPLES.md §11.
        run: |
          ! grep -rnE 'Step\s+\$\{[^}]+\}\s+of\b|step-\$\{(current|active|step|stepIndex)\b|currentStep[^,)]*of[^,)]*totalSteps' \
            src/ \
            --include="*.tsx" \
            --exclude="src/components/ui/wizard-steps.tsx" \
            --exclude-dir=node_modules \
            || (echo "::error::hand-rolled step indicator found — use <WizardSteps>/<WizardStep> from @/components/ui/wizard-steps"; exit 1)

      - name: "Hand-rolled bottom-nav (use BottomNav primitive)"
        # Catches fixed-position bottom tab bars built as inline `<nav>`
        # elements outside the canonical primitive at
        # `src/components/ui/bottom-nav.tsx`. Scoped to the `<nav>` tag
        # specifically — fixed-bottom action bars (e.g. operations CTA
        # strip) and bottom-drawer chrome (e.g. QuickCheckDrawer) are NOT
        # nav-bar patterns and intentionally NOT caught here. Re-tune if
        # a legitimate `<nav class="fixed bottom-0 …">` pattern emerges
        # outside the caregiver portal.
        # See docs/ui-audit/DESIGN_PRINCIPLES.md §12 / §13.
        run: |
          ! grep -rnE '<nav\b[^>]*className="[^"]*\b(fixed|inset-x-0)\b[^"]*\bbottom-0\b' \
            src/ \
            --include="*.tsx" \
            --exclude="src/components/ui/bottom-nav.tsx" \
            --exclude-dir=node_modules \
            || (echo "::error::hand-rolled bottom-nav <nav> found — use <BottomNav>/<BottomNavItem> from @/components/ui/bottom-nav"; exit 1)

      - name: "Oversized hero radii on portal shells (rounded-[2.5rem]/[1.8rem]/[3rem])"
        # Catches the moonshot floating-dock / hero-tile radii that Family
        # shipped before §13/§14 standardization. Scoped to layout shells
        # only — existing violations in route-page workflows (e.g. caregiver
        # resident pages, family calendar/billing) are Phase D scope, not
        # shell scope. Expand the scope as those files migrate.
        # See docs/ui-audit/DESIGN_PRINCIPLES.md §12.
        run: |
          ! grep -rnE 'rounded-\[(2\.5rem|2rem|1\.8rem|1\.75rem|3rem)\]' \
            src/components/layout/ \
            --include="*.tsx" \
            --exclude-dir=node_modules \
            || (echo "::error::hero/dock radii (rounded-[2.5rem]/[1.8rem]/[3rem]) on a layout shell — use rounded-xl"; exit 1)

      - name: "glass-card-* utilities on portal shells (use flat bg-card)"
        # Catches the moonshot `glass-card`, `glass-card-light`, `glass-panel`
        # utility set. Scoped to layout shells only — existing violations
        # in route-page workflows (caregiver/tasks, caregiver/meds,
        # family/calendar, family/billing) are Phase D scope. The
        # `src/components/ui/moonshot/v2-card.tsx` defanged stub contains
        # the string in a comment describing what it used to be; the layout
        # scope avoids both cases. See docs/ui-audit/DESIGN_PRINCIPLES.md §12.
        run: |
          ! grep -rnE '\bglass-(card|panel|card-light)\b' \
            src/components/layout/ \
            --include="*.tsx" \
            --exclude-dir=node_modules \
            || (echo "::error::glass-card-* utility on a layout shell — use flat bg-card border-border"; exit 1)

      - name: "backdrop-blur on portal shells (Dialog/Sheet/Popover only)"
        # `backdrop-blur` is fine on overlay primitives (Dialog, Sheet,
        # Popover, DropdownMenu) but not on portal shell chrome. Layout
        # shells render their backdrop as semantic `bg-background/95
        # supports-[backdrop-filter]:bg-background/80 backdrop-blur` —
        # the supports-fallback is the pattern; raw `backdrop-blur-xl` is not.
        # Heuristic: catch `backdrop-blur-xl` or `backdrop-blur-3xl` in
        # `src/components/layout/**`. The standard pattern uses
        # `backdrop-blur` (no modifier) and survives.
        # See docs/ui-audit/DESIGN_PRINCIPLES.md §12.
        run: |
          ! grep -rnE '\bbackdrop-blur-(xl|2xl|3xl)\b' \
            src/components/layout/ \
            --include="*.tsx" \
            --exclude-dir=node_modules \
            || (echo "::error::backdrop-blur-{xl,2xl,3xl} on layout shell — use plain backdrop-blur with supports-[backdrop-filter]:bg-background/80 fallback"; exit 1)

      - name: "Hover states in family route group (replace with active: + focus-visible:)"
        # Family portal is tablet-only — hover is not a reliable input.
        # Replace every `hover:X` with `active:X` + `focus-visible:X`.
        # Scoped narrowly to the shell + family-specific components. The
        # family route group (`src/app/(family)/**`) is NOT scanned here;
        # those pages are Phase D scope.
        # See docs/ui-audit/DESIGN_PRINCIPLES.md §14.
        run: |
          set +e
          MATCHES=$(grep -rEn 'className=("|`|cn\()[^"`]*\bhover:[a-z-]' \
            src/components/layout/FamilyShell.tsx \
            src/components/family/ \
            --include="*.tsx" \
            --exclude-dir=node_modules 2>/dev/null \
            | grep -v 'group-hover:')
          set -e
          if [ -n "$MATCHES" ]; then
            echo "::error::family chrome contains hover:* — tablet-only, replace with active: + focus-visible:"
            echo "$MATCHES"
            exit 1
          fi

      - name: "Hover-only states on audited caregiver chrome (pair with active:)"
        # On the caregiver shell + caregiver-scoped primitives, every
        # hover:X utility must ship with a matching active:X so touch
        # devices that never fire hover still render pressed-state
        # feedback. Heuristic: flag any className that contains `hover:`
        # without a corresponding `active:` token in the same string.
        # Scoped narrowly to the files Phase C has audited — caregiver
        # route-page workflows (`src/app/(caregiver)/**`) are NOT scanned
        # here; their hover/active pairing is the responsibility of a
        # future Phase D workflow-page audit. Expand the scope incrementally
        # as those files migrate.
        # See docs/ui-audit/DESIGN_PRINCIPLES.md §13.
        run: |
          set +e
          MATCHES=$(grep -rEn 'className=("|`|cn\()[^"`]*\bhover:[a-z-]' \
            src/components/layout/CaregiverShell.tsx \
            src/components/ui/bottom-nav.tsx \
            src/components/ui/status-pill.tsx \
            --include="*.tsx" \
            --exclude-dir=node_modules 2>/dev/null \
            | grep -v 'active:' \
            | grep -v 'group-hover:')
          set -e
          if [ -n "$MATCHES" ]; then
            echo "::error::caregiver chrome hover:* without a matching active:* — pair them so touch devices render pressed feedback"
            echo "$MATCHES"
            exit 1
          fi
